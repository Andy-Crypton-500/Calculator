<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Flip Card Calculator</title>
    <link
      rel="icon"
      type="image/x-icon"
      href="/Math_programming_calc_figure_2_half_column_mobile.jpg"
    />
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
    />
    <style>
      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        background-image:
          linear-gradient(rgba(10, 15, 35, 0.25), rgba(10, 15, 35, 0.4)),
          url("/pao-pattarapol-rf4IuDOfyEU-unsplash.jpg");
        background-size: cover;
        background-position: center;
        background-attachment: fixed;
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      }

      /* Navigation */
      #nav {
        width: 100%;
        min-height: 75px;
        background: rgba(20, 25, 45, 0.35);
        backdrop-filter: blur(18px);
        -webkit-backdrop-filter: blur(18px);
        border-bottom: 1px solid rgba(255, 255, 255, 0.2);
        box-shadow: 0 5px 25px rgba(0, 0, 0, 0.12);

        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 0 5%;

        position: fixed;
        top: 0;
        left: 0;
        z-index: 1000;

        color: white;
        font-weight: 600;
      }

      #nav > div {
        display: flex;
        align-items: center;
        gap: 30px;
      }

      #link {
        color: white;
        text-decoration: none;
        font-size: 1.4rem;
        font-weight: 750;
        letter-spacing: 0.5px;
        transition: 0.3s;
      }

      #link:hover {
        color: #b8c7ff;
      }

      #nav a:not(#link) {
        color: white !important;
        text-decoration: none !important;
        font-size: 1rem;
        transition: color 0.25s ease;
      }

      #nav a:not(#link):hover {
        color: #a9bbff !important;
      }

      /* Remove old absolute positioning */
      #about,
      #login,
      #contact,
      #game,
      #username-display {
        position: static;
      }

      /* Main content */
      #app {
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 110px 20px 30px;
      }

      /* Flip card */
      .flip-card {
        width: min(500px, 90vw);
        height: 330px;
        perspective: 1500px;
        cursor: pointer;
        transition: transform 0.35s ease;
      }

      .flip-card:hover {
        transform: translateY(-6px);
      }

      .flip-card-inner {
        position: relative;
        width: 100%;
        height: 100%;
        transform-style: preserve-3d;
        transition: transform 0.85s cubic-bezier(0.2, 0.7, 0.3, 1);
        border-radius: 25px;
      }

      .flip-card.flipped .flip-card-inner {
        transform: rotateY(180deg);
      }

      /* Card faces */
      .flip-card-front,
      .flip-card-back {
        position: absolute;
        width: 100%;
        height: 100%;
        border-radius: 25px;

        color: white;
        text-align: center;

        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;

        padding: 30px;

        background: linear-gradient(
          135deg,
          rgba(255, 255, 255, 0.22),
          rgba(255, 255, 255, 0.07)
        );

        backdrop-filter: blur(22px);
        -webkit-backdrop-filter: blur(22px);

        border: 1px solid rgba(255, 255, 255, 0.3);

        box-shadow:
          0 20px 60px rgba(0, 0, 0, 0.25),
          inset 0 1px 1px rgba(255, 255, 255, 0.25);

        backface-visibility: hidden;
        -webkit-backface-visibility: hidden;
      }

      .flip-card-front h1 {
        font-size: clamp(1.8rem, 5vw, 2.4rem);
        margin-bottom: 12px;
        text-shadow: 0 3px 15px rgba(0, 0, 0, 0.25);
      }

      .flip-card-front h3 {
        font-size: 1.05rem;
        font-weight: 400;
        line-height: 1.6;
        color: rgba(255, 255, 255, 0.9);
      }

      .flip-card-front small {
        margin-top: 25px;
        padding: 9px 18px;
        border-radius: 30px;
        background: rgba(255, 255, 255, 0.15);
        border: 1px solid rgba(255, 255, 255, 0.2);
        color: white;
      }

      .flip-card-back {
        transform: rotateY(180deg);
      }

      /* Calculator buttons */
      #buttons {
        display: flex;
        flex-direction: column;
        align-items: stretch;
        gap: 15px;
        width: 100%;
        max-width: 330px;
      }

      #buttons button {
        padding: 15px 20px;
        border-radius: 14px;

        border: 1px solid rgba(255, 255, 255, 0.35);
        background: rgba(255, 255, 255, 0.14);

        color: white;
        font-size: 1rem;
        font-weight: 600;

        cursor: pointer;
        transition: all 0.3s ease;
      }

      #buttons button:hover {
        background: rgba(255, 255, 255, 0.3);
        border-color: white;
        transform: translateY(-3px);
        box-shadow: 0 8px 20px rgba(0, 0, 0, 0.15);
      }

      #buttons button:active {
        transform: scale(0.97);
      }

      /* User dropdown */
      .user-dropdown {
        position: relative;
        display: inline-block;
        color: white;
      }

      .user-dropdown .dropbtn {
        cursor: pointer;
        user-select: none;
        white-space: nowrap;
      }

      .user-dropdown .dropdown-content {
        display: none;
        position: absolute;
        top: 100%;
        right: 0;
        margin-top: 12px;

        min-width: 150px;
        background: rgba(25, 30, 50, 0.95);
        backdrop-filter: blur(15px);

        border: 1px solid rgba(255, 255, 255, 0.2);
        border-radius: 12px;

        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
        overflow: hidden;
        z-index: 1001;
      }

      .user-dropdown .dropdown-content a {
        display: block;
        padding: 12px 16px;
        color: white !important;
        text-decoration: none;
        transition: background 0.2s;
      }

      .user-dropdown .dropdown-content a:hover {
        background: rgba(255, 255, 255, 0.15);
      }

      .user-dropdown.open .dropdown-content {
        display: block;
      }

      /* Mobile responsiveness */
      @media (max-width: 650px) {
        #nav {
          padding: 15px 4%;
          flex-wrap: wrap;
          gap: 15px;
        }

        #nav > div {
          gap: 14px;
          flex-wrap: wrap;
        }

        #link {
          font-size: 1.2rem;
        }

        #nav a:not(#link) {
          font-size: 0.85rem;
        }

        .flip-card {
          height: 320px;
        }

        .flip-card-front,
        .flip-card-back {
          padding: 20px;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          transition-duration: 0.01ms !important;
          animation-duration: 0.01ms !important;
        }
      }
    </style>
  </head>
  <body>
    <div id="nav">
      <div><a href="index.html" id="link">My Calculator</a></div>
      <div>
        <a
          href="login.html"
          style="margin-right: 20px; color: white; text-decoration: none"
          id="login"
          >Login</a
        >
        <a href="#" style="color: white; text-decoration: none" id="about"
          >About</a
        >
        <a
          href="contract.html"
          style="color: white; text-decoration: none"
          id="contact"
          >Contract</a
        >
        <a
          href="game.html"
          style="color: white; text-decoration: none"
          id="game"
          >Game</a
        >
        <span id="username-display"></span>
      </div>
    </div>

    <div id="app">
      <div class="flip-card" onclick="this.classList.toggle('flipped')">
        <div class="flip-card-inner">
          <div class="flip-card-front">
            <h1>Welcome to My Calculator!</h1>
            <h3>The one and only scientific/graphing calculator!</h3>
            <small>Click to continue</small>
          </div>
          <div class="flip-card-back">
            <div id="buttons">
              <button id="scientific">Scientific Calculator</button>
              <button id="graphing">Graphing Calculator</button>
              <button id="calculus">Derivative/Integral Calculator</button>
            </div>
          </div>
        </div>
      </div>
    </div>

    <script>
      const username = localStorage.getItem("loggedInUser");
      const usernameDisplay = document.getElementById("username-display");
      const loginLink = document.getElementById("login");

      if (username && usernameDisplay) {
        usernameDisplay.innerHTML = `
          <div class="user-dropdown">
            <span class="dropbtn"> <i class="bi bi-person-fill"></i> Hello, ${username} ▼</span>
            <div class="dropdown-content">
              <a href="#" id="logout">Logout</a>
            </div>
          </div>
        `;

        document.getElementById("about").style.right = "620px";
        document.getElementById("contact").style.right = "500px";
        document.getElementById("game").style.right = "400px";
        document.getElementById("username-display").style.right = "100px";

        const nav = document.getElementById("nav");
        nav.classList.add("white-links");

        if (loginLink) {
          loginLink.style.display = "none";
        }

        // Dropdown delay logic
        const userDropdown = document.querySelector(".user-dropdown");
        let timeoutId;

        userDropdown.addEventListener("mouseenter", () => {
          clearTimeout(timeoutId);
          userDropdown.classList.add("open");
        });

        userDropdown.addEventListener("mouseleave", () => {
          timeoutId = setTimeout(() => {
            userDropdown.classList.remove("open");
          }, 300); // 1 second delay after mouse leaves
        });

        // Logout click handler
        document
          .getElementById("logout")
          .addEventListener("click", function () {
            logOut();
            usernameDisplay.innerHTML = `<a href="login.html" style="color: white; text-decoration: none"><i class="bi bi-person-circle"></i> Sign In: </a>`;
            loginLink.style.display = "inline";
            document.getElementById("about").style.right = "460px";
            document.getElementById("login").style.right = "560px";
            document.getElementById("contact").style.right = "340px";
            document.getElementById("game").style.right = "240px";
            document.getElementById("username-display").style.right = "100px";
            const nav = document.getElementById("nav");
            nav.classList.add("white-links");
          });
      } else {
        usernameDisplay.innerHTML = `<a href="login.html" style="color: white; text-decoration: none" title:"Save your computations"><i class="bi bi-person-circle"></i> Sign In: </a>`;
      }

      function confirmRedirect(title, text, url) {
        Swal.fire({
          title: "Are you sure you want to leave? You won't be able to return!",
          text: text,
          icon: "warning",
          showCancelButton: true,
          confirmButtonColor: "#3085d6",
          cancelButtonColor: "#d33",
          confirmButtonText: "Yes!",
        }).then((result) => {
          if (result.isConfirmed) {
            Swal.fire({
              title: "Redirecting...!",
              icon: "success",
              timer: 1000,
              showConfirmButton: false,
            });
            setTimeout(() => (window.location.href = url), 1000);
          }
        });
      }

      document
        .getElementById("scientific")
        .addEventListener("click", () =>
          confirmRedirect(
            "Scientific Calculator",
            "You will be redirected to the scientific calculator",
            "scientific.html",
          ),
        );
      document
        .getElementById("graphing")
        .addEventListener("click", () =>
          confirmRedirect(
            "Graphing Calculator",
            "You will be redirected to the graphing calculator",
            "graph.html",
          ),
        );
      document
        .getElementById("calculus")
        .addEventListener("click", () =>
          confirmRedirect(
            "Derivative and Integral Calculator",
            "You will be redirected to the derivative/integral calculator",
            "derivative.html",
          ),
        );

      function logOut() {
        localStorage.removeItem("loggedInUser");
        Swal.fire({
          icon: "success",
          title: "You have been logged out!",
          timer: 1000,
          showConfirmButton: false,
        });
      }
    </script>
  </body>
</html>
